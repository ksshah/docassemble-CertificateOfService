#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_certificate_of_service
code: |
  # Set the allowed courts for this interview
  allowed_courts = []
  nav.set_section("review_certificate_of_service")
  # Below sets the user_role and user_ask_role by asking a question.
  # You can set user_ask_role directly instead to either 'plaintiff' or 'defendant'
  user_ask_role
  users.gather()
  set_parts(subtitle=str(users))
  service_date
  if user_ask_role == 'defendant':
    is_defendant_served = True
    defendants = users
    plaintiffs = other_parties
  else:
    is_plaintiff_served = True
    defendants = other_parties
    plaintiffs = users
  set_progress(14)
  other_parties.gather()
  papers_served
  set_progress(28)
  paper_serving_mechanism  
  set_progress(42)
  docket_number
  signature_date
  users[0].address.address
  set_progress(56)
  users[0].phone_number
  users[0].email
  users[0].signature
  interview_order_certificate_of_service = True
---
code: |
  users[i].name.first
  users[i].address.address
  users[i].phone_number
  users[i].complete=True
---
code: |
  other_parties[i].name.first
  other_parties[i].service_address.address
  other_parties[i].phone_number
  other_parties[i].complete=True
