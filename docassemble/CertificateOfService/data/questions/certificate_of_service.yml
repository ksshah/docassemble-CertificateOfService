---
id: Date of Service
question: |
  Date of Service
fields:
  - "Date of service": service_date
    datatype: date
---
id: Choose papers served
question: |
  Choose papers served
fields:
  - "What papers did you serve?": papers_served
    input type: area
    maxlength: 497
---
id: How did you serve the papers
question: |
  How did you serve the papers
fields:
  - How did you serve the papers: paper_serving_mechanism
    input type: radio
    choices:
      - Service by Mail: mail
      - Personal Service: personal
---
id: preview certificate_of_service
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_court_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_certificate_of_service'), label='Edit answers', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: certificate_of_service_preview_question    
---
code: |
  signature_fields = ['users[0].signature']
---
code: |
  # This is a placeholder for the addresses that will be searched
  # for matching address to court. Edit if court venue is based on 
  # a different address than the user's
  [user.address.address for user in users.complete_elements()]
  addresses_to_search = [user.address for user in users.complete_elements()]
---
id: certificate of service review screen
event: review_certificate_of_service
question: |
  Review your answers
review:
  - Edit: plaintiffs.revisit
    button: |
      **Plaintiffs**

      % for item in plaintiffs:
        * ${ item }
      % endfor
  - Edit: docket_number
    button: |
      **Docket number**:
      ${ docket_number }
  - Edit: defendants.revisit
    button: |
      **Defendants**

      % for item in defendants:
        * ${ item }
      % endfor
  - Edit: service_date
    button: |
      **Date of service**:
      ${ service_date }
  - Edit: is_plaintiff_served
    button: |
      **Are you serving the plaintiff**:
      ${ word(yesno(is_plaintiff_served)) }
  - Edit: is_defendant_served
    button: |
      **Are you serving the defendant**:
      ${ word(yesno(is_defendant_served)) }
  - Edit: papers_served
    button: |
      **What papers did you serve?**:
      > ${ single_paragraph(papers_served) }
  - Edit: paper_serving_mechanism
    button: |
      **You served the papers by**:
      ${ "by hand" if paper_serving_mechanism == "personal" else "by mail" }
  - Edit: personalservedusers1_name_full
    button: |
      **Who did you handover the served papers the papers?**:
      ${ personalservedusers1_name_full }
  - Edit: personalservedsers1_address_block
    button: |
      **At what address did you hand over the papers?**:
      > ${ single_paragraph(personalservedsers1_address_block) }
  - Edit: is_mail_service
    button: |
      **Did you serve the papers via Mail**:
      ${ word(yesno(is_mail_service)) }
  - Edit: mailservedusers1_name_full
    button: |
      **To whom did you mail the served papers?**:
      ${ mailservedusers1_name_full }
  - Edit: mailservedusers1_mailing_address_block
    button: |
      **To what address did you mail the papers?**:
      > ${ single_paragraph(mailservedusers1_mailing_address_block) }
  - Edit: signature_date
    button: |
      **Date of signature**:
      ${ signature_date }
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
---
continue button field: plaintiffs.revisit
question: |
  Edit plaintiffs
